<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pramana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&display=swap">
<style>
:root{
  --chrome:#f7f7f5; --bg:#ffffff; --hover:#f2f3f0; --sel:#eef2ec;
  --ink:#1a1d1b; --t2:#454c47; --t3:#646b66; --t4:#8a908b;
  --line:#e5e6e2; --line2:#d6d8d3;
  --primary:#18301f; --on-primary:#ffffff; --mark:#f7d678; --on-mark:#1a1d1b;
  --diff:#b42318; --ok:#2e6b45; --lower:#2f6c8f; --higher:#b5652b; --null:#a3a9a4;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --top:48px; --side:200px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
mark{background:var(--mark);color:var(--on-mark);border-radius:3px;padding:0 4px}
.app{display:grid;grid-template-rows:var(--top) minmax(0,1fr);grid-template-columns:var(--side) minmax(0,1fr);height:100vh;height:100dvh}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;background:var(--chrome);border-bottom:1px solid var(--line)}
.wordmark{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:20px;letter-spacing:-.01em;width:calc(var(--side) - 28px);flex:none;text-decoration:none;color:var(--ink)}
.search{flex:1 1 auto;max-width:680px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line2);border-radius:8px;height:32px;padding:0 6px 0 10px}
.search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(24,48,31,.12)}
.search svg{flex:none;color:var(--t3)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;height:30px}
kbd{font:500 11px var(--mono);color:var(--t3);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--chrome);white-space:nowrap}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;padding:2px;background:var(--bg);flex:none}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;font-size:12.5px;color:var(--t2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.iconbtn{flex:none;border:1px solid var(--line2);background:var(--bg);border-radius:8px;height:30px;padding:0 10px;cursor:pointer;font-size:12.5px;color:var(--t2)}
.side{background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:auto}
.nav{display:grid;gap:1px;padding:10px 8px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:6px;color:var(--t2);text-decoration:none;font-size:13.5px}
.nav a:hover{background:var(--hover)}
.nav a[aria-current="page"]{background:var(--sel);color:var(--primary);font-weight:600}
.nav .ct{font:500 11.5px var(--mono);color:var(--t3)}
.snapinfo{margin-top:auto;padding:12px 18px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--t3);display:grid;gap:2px}
.snapinfo b{color:var(--ink);font-weight:500}
.main{min-width:0;min-height:0;overflow:auto;background:var(--bg)}
.page{max-width:1120px;padding:16px 24px 48px}
.crumbs{font-size:12.5px;color:var(--t3);display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.crumbs a{color:var(--t3);text-decoration:none}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.crumbs span[aria-hidden]{color:var(--t4)}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.ph h1{font-size:20px;font-weight:600;margin:0;line-height:1.3;letter-spacing:-.01em}
.ph p{margin:4px 0 0;color:var(--t3);font-size:13.5px}
.ph .id{font:500 12px var(--mono);color:var(--t3);white-space:nowrap}
h2.h{font-size:14px;font-weight:600;margin:24px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2.h span{font-weight:400;color:var(--t3);font-size:12.5px}
.state{padding:14px 0;color:var(--t3);font-size:13.5px}
.state b{color:var(--ink);font-weight:500}
.box{border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--bg);border-radius:6px;height:32px;padding:0 12px;cursor:pointer;font-size:13px;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn:disabled{opacity:.55;cursor:default}
/* home */
.home{max-width:none;padding:0}
.hero{position:relative;overflow:hidden;color:#eef2ec;background:radial-gradient(120% 140% at 85% 0%,#2f6343 0%,#18301f 48%,#0d1a12 100%);padding:64px 48px 44px}
.hero svg.net{position:absolute;right:-40px;top:-30px;width:640px;height:420px;opacity:.55;pointer-events:none}
.hero .in{position:relative;max-width:820px}
.brand{font-family:Newsreader,Georgia,serif;font-size:76px;line-height:.95;letter-spacing:-.025em;margin:0;font-weight:400}
.gloss{font-family:Newsreader,Georgia,serif;font-style:italic;font-weight:300;color:#a9c2b0;font-size:19px;margin:10px 0 30px}
.hero h1{font-size:26px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px;color:#ffffff}
.hero .sub{color:#b9ccbf;margin:0 0 22px;font-size:15.5px}
.bigsearch{display:flex;gap:8px;background:#ffffff;border-radius:12px;padding:6px;box-shadow:0 12px 40px rgba(0,0,0,.28)}
.bigsearch input{flex:1;min-width:0;height:46px;border:0;border-radius:8px;padding:0 12px;font-size:17px;background:transparent;color:var(--ink)}
.bigsearch input:focus{outline:0}
.bigsearch .btn{height:46px;padding:0 22px;background:var(--mark);border-color:var(--mark);color:#1a1d1b;font-weight:600;border-radius:8px}
.bigsearch .btn:hover{background:#f3c94f}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chips a{font-size:13px;color:#e3ece5;text-decoration:none;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);border-radius:999px;padding:6px 12px}
.chips a:hover{background:rgba(255,255,255,.14)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:0;border-bottom:1px solid var(--line);background:var(--chrome)}
.stats div{padding:20px 24px;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0;padding-left:48px}
.stats b{display:block;font:400 34px/1.1 Newsreader,Georgia,serif;letter-spacing:-.01em}
.stats span{font-size:12.5px;color:var(--t3)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:28px 48px 48px;max-width:1240px}
.card{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:10px;padding:16px 16px 18px;text-decoration:none;color:var(--ink);background:var(--bg);transition:border-color .15s,box-shadow .15s,transform .15s}
.card:hover{border-color:var(--primary);box-shadow:0 8px 24px rgba(24,48,31,.10);transform:translateY(-1px)}
.card svg{color:var(--primary)}
.card b{font-size:15px;font-weight:600}
.card span{font-size:13px;color:var(--t3);line-height:1.4}
.entries{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:20px 0 0;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 12px;cursor:pointer;color:var(--t3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--primary);font-weight:600}
.tabs .ct{font:500 11.5px var(--mono);color:var(--t3);margin-left:4px}
.tabpanel{padding-top:12px}
/* parsed claim */
.parsed{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden}
.parsed div{padding:9px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.parsed dt{font-size:12px;color:var(--t3)}
.parsed dd{margin:2px 0 0;font-size:13.5px}
.by{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:8px;font-size:12.5px;color:var(--t3)}
.chip{font-size:12px;border:1px solid var(--line2);border-radius:4px;padding:0 6px;color:var(--t2);background:var(--chrome)}
.ai{margin-top:14px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--chrome)}
.ai .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--t3);margin-bottom:6px}
.ai .tx{white-space:pre-wrap;font-size:14px;line-height:1.55;max-width:80ch}
/* rows */
.rows{border-top:1px solid var(--line)}
.pair{padding:10px 2px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.pair h3{margin:0;font-size:14px;font-weight:600;line-height:1.3}
.pair h3 a{color:var(--ink);text-decoration:none}
.pair h3 a:hover{text-decoration:underline}
.pair h3 i{font-style:normal;color:var(--t4);font-weight:400;padding:0 4px}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12.5px;color:var(--t3)}
.meta b{color:var(--ink);font:500 12.5px var(--mono)}
.dir{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);max-width:420px}
.dir i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--t3);margin:4px 0 8px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}
.claim{padding:9px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.claim small{display:block;color:var(--t3);font-size:12px;margin-top:3px}
.claim small a{color:var(--t3)}
.tag{display:inline-block;font-size:11px;color:var(--t2);border:1px solid var(--line2);border-radius:4px;padding:0 5px;margin-right:6px;line-height:17px}
/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:70vh}
table{border-collapse:collapse;width:100%}
.dt{font-size:13px}
.dt th{position:sticky;top:0;background:var(--chrome);z-index:1;text-align:left;font-weight:500;font-size:12px;color:var(--t3);border-bottom:1px solid var(--line);padding:0;white-space:nowrap}
.dt th>span,.dt th button{display:block;border:0;background:transparent;padding:8px 10px;width:100%;text-align:inherit;cursor:pointer;color:inherit;font-weight:500}
.dt th>span{cursor:default}
.dt th.n,.dt td.n{text-align:right}
.dt th[aria-sort] button{color:var(--ink)}
.dt td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.dt tr:last-child td{border-bottom:0}
.dt tbody tr.click{cursor:pointer}
.dt tbody tr.click:hover td{background:var(--hover)}
.dt td.dirc{width:170px;min-width:110px;vertical-align:middle}
.dt td small{display:block;color:var(--t3);font-size:12px}
.toolbar{display:flex;align-items:center;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.toolbar input{height:30px;border:1px solid var(--line2);border-radius:6px;padding:0 10px;min-width:0;flex:0 1 320px;background:var(--bg)}
.toolbar input:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px rgba(24,48,31,.12)}
.toolbar .ct{font-size:12.5px;color:var(--t3)}
/* receipt */
.receipt{border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.r-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.r-head .k{font-size:12px;color:var(--t3)}
.r-head h2{margin:2px 0 0;font-size:16px;font-weight:600;line-height:1.35}
.r-head .id{font:500 11.5px var(--mono);color:var(--t3);white-space:nowrap}
.r-sec{padding:12px 16px;border-bottom:1px solid var(--line)}
.r-sec:last-child{border-bottom:0}
.lbl{font-size:12px;color:var(--t3);margin:0 0 4px}
.ft th,.ft td{text-align:left;vertical-align:top;padding:7px 10px 7px 0;border-bottom:1px solid var(--line);font-size:13px}
.ft th{font-size:12px;font-weight:500;color:var(--t3)}
.ft tr:last-child td{border-bottom:0}
.ft td.f{font-weight:500;white-space:nowrap;color:var(--t2)}
.dlab{display:inline-block;margin-top:3px;font-size:12px;cursor:help;border-bottom:1px dotted currentColor}
.dlab.x{color:var(--diff)} .dlab.o{color:var(--ok)} .dlab.n{color:var(--t3)}
.sum{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.sum b{font-weight:600}
.note p{margin:0 0 8px;font-size:13.5px;max-width:78ch}
.note p:last-child{margin-bottom:0}
.bars{display:grid;grid-template-columns:max-content minmax(0,1fr) max-content;gap:4px 10px;align-items:center;font-size:12.5px;margin:6px 0 8px;max-width:520px}
.bars i{display:block;height:6px;border-radius:3px;background:var(--t2)}
.lensline{font-size:12.5px;color:var(--t3)}
.lensline summary{cursor:pointer}
.lensline dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:10px 0 2px}
.lensline dt{color:var(--ink);font-weight:500}
.lensline dd{margin:0}
.cmp .src{font-weight:600;color:var(--ink);font-size:13px}
.cmp .src small{display:block;font-weight:400;color:var(--t3);font-size:11.5px;margin-top:1px}
.cmp .ans{font:600 15px var(--mono);white-space:nowrap}
.cmp .unit{display:block;font-size:12px;color:var(--t3);margin-top:2px}
.ovx{overflow-x:auto}
body.raw .lens{display:none!important}
body:not(.raw) .rawonly{display:none!important}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 18px;font-size:13.5px;margin:4px 0}
.kv dt{color:var(--t3)}
.kv dd{margin:0;overflow-wrap:anywhere}
.prose p{margin:0 0 10px;color:var(--t2);line-height:1.55;max-width:72ch}
.loading{padding:48px 24px;color:var(--t3);font-size:13.5px}
.loading .box2{display:grid;gap:10px;justify-items:start;max-width:440px}

/* graphs */
.graph{position:relative;border:1px solid var(--line);border-radius:8px;background:#fbfbfa;height:480px;overflow:hidden}
.graph.tall{height:calc(100vh - 210px);min-height:420px}
.graph svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.graph svg:active{cursor:grabbing}
.graph .gnote{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--t3);background:rgba(251,251,250,.9);padding:2px 6px;border-radius:4px}
.graph .gctl{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.graph .gctl button{width:28px;height:28px;border:1px solid var(--line2);background:var(--bg);border-radius:6px;cursor:pointer;font:500 14px var(--sans);color:var(--t2)}
.gtip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:6px 8px;font-size:12px;line-height:1.4;max-width:300px;z-index:5}
.gtip b{font-weight:600}
.gtip .num{font-size:11.5px}
.glegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--t3);margin:8px 0}
.glegend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c);vertical-align:-1px}
.glegend span.sq::before{border-radius:2px}
.node-label{font:11px var(--sans);fill:var(--t2);pointer-events:none}
/* results */
.rgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
.plist{border-top:1px solid var(--line)}
.prow{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 2px;cursor:pointer;color:var(--ink)}
.prow:hover{background:var(--hover)}
.prow b{display:block;font-weight:500;font-size:13.5px;line-height:1.35}
.prow small{display:block;color:var(--t3);font-size:12px;margin-top:2px}
.prow .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
.sumbox{margin:14px 0 4px;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.sumbox .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--t3);margin-bottom:6px}
.sumbox .tx{font-size:14.5px;line-height:1.6;max-width:85ch}
.sumbox .tx a{font:500 12px var(--mono);text-decoration:none;background:var(--chrome);border:1px solid var(--line);border-radius:4px;padding:0 4px;cursor:pointer}
.status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--t3);margin-top:8px}
.spin{width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--primary);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,24,22,.12);z-index:29}
.drawer{position:fixed;top:var(--top);right:0;bottom:0;width:460px;max-width:100%;background:var(--bg);border-left:1px solid var(--line2);z-index:30;overflow:auto;padding:14px 18px 32px;transform:translateX(102%);transition:transform .18s ease-out;visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.drawer .dh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:8px}
.drawer h2{font-size:16px;line-height:1.35;margin:0;font-weight:600}
.drawer .x{flex:none;width:30px;height:30px;border:1px solid var(--line2);border-radius:6px;background:var(--bg);cursor:pointer;font-size:16px;color:var(--t2)}
.drawer .acts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.ctx{padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.5}
.ctx small{display:block;font-size:11.5px;color:var(--t3);margin-bottom:2px}
@media (max-width:860px){
  .rgrid{grid-template-columns:minmax(0,1fr)}
  .graph{height:380px}.graph.tall{height:70vh}
  .drawer{top:auto;left:0;width:100%;height:78vh;border-left:0;border-top:1px solid var(--line2);border-radius:12px 12px 0 0;transform:translateY(102%)}
  .drawer.open{transform:none}
}
/* settings popover */
.pop{position:absolute;right:12px;top:52px;width:340px;max-width:calc(100vw - 24px);background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:14px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.08);display:grid;gap:8px;font-size:13px}
.pop input[type=password]{height:32px;border:1px solid var(--line2);border-radius:6px;padding:0 10px}
.pop p{margin:0;color:var(--t3);font-size:12.5px}
@media (max-width:1100px){.seg button{padding:4px 8px}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);height:auto;min-height:100vh}
  .top{flex-wrap:wrap;padding:8px 12px;gap:8px}
  .wordmark{width:auto;flex:1}
  .search{order:5;flex:1 1 100%;max-width:none}
  .search kbd,.spacer{display:none}
  .side{border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .nav{grid-template-columns:repeat(5,auto);justify-content:start;overflow-x:auto;padding:6px 8px}
  .snapinfo{display:none}
  .main{overflow:visible}
  .page{padding:12px 14px 40px}
  .home{padding:24px 14px 40px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));padding:20px 16px 40px}
  .hero{padding:40px 16px 32px}
  .brand{font-size:56px}
  .stats div:first-child{padding-left:24px}
  .stats div:nth-child(3){border-left:0}
  .stats div:nth-child(n+3){border-top:1px solid var(--line)}
  .ph{flex-direction:column;gap:4px}
  .tw{max-height:none}
  .dt th{position:static}
}
body.on-home .top .search{visibility:hidden}
</style>

<div class="app">
  <header class="top">
    <a class="wordmark" href="#/">Pramana</a>
    <form class="search" id="askf" role="search">
      <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="q" autocomplete="off" aria-label="Search the evidence" placeholder="Search the evidence: any claim or question">
      <kbd aria-hidden="true" id="kbd">⌘K</kbd>
    </form>
    <span class="spacer"></span>
    <div class="seg" role="group" aria-label="Lens">

      <button type="button" data-lens="raw" aria-pressed="false" title="Reported values only, no interpretation">Raw data</button>
    </div>
    <button type="button" class="iconbtn" id="setbtn" hidden aria-expanded="false" aria-controls="pop">AI key</button>

  <div class="pop" id="pop" hidden role="dialog" aria-label="AI settings">

    <input type="password" id="keyin" placeholder="sk-ant-..." autocomplete="off" aria-label="Anthropic API key">
    <label><input type="checkbox" id="keyremember"> Remember on this device</label>
    <div style="display:flex;gap:8px"><button class="btn primary" id="keysave" type="button">Save</button><button class="btn" id="keyclear" type="button">Clear</button></div>
  </div>
  <aside class="side">
    <nav class="nav" aria-label="Pages">
      <a href="#/" data-v="home">Home</a>

      <a href="#/map" data-v="map">Evidence map <span class="ct" id="npairs"></span></a>
      <a href="#/network" data-v="network">Paper network</a>
      <a href="#/about" data-v="about">About</a>
      <a href="contribute/">Contribute papers</a>
    </nav>
    <div class="snapinfo" id="snapinfo"></div>
  </aside>
  <main class="main" id="main" tabindex="-1">
    <div class="loading" id="loading"><div class="box2" id="loadbox">Loading the evidence snapshot</div></div>
    <div id="view"></div>
  </main>
</div>

function conceptScores(q, raw) {

    ${claims.length ? claims.map(c => `<div class="ctx"><small>${esc(c[0])} · ${esc(c[1])}</small>${esc(c[2])}</div>`).join('') : '<div class="state">None extracted.</div>'}
    <h2 class="h">Estimates <span>${est.length}</span></h2>
    ${est.length ? `<div class="tw" style="max-height:340px"><table class="dt"><thead><tr><th><span>Exposure → outcome</span></th><th class="n"><span>Estimate</span></th><th><span>Level</span></th></tr></thead><tbody>${est.slice(0, 80).map(r => `<tr><td><a href="#/pair/${r[1]}/${r[2]}">${esc(K[r[1]].label)} → ${esc(K[r[2]].label)}</a><small>${esc(r[3])}</small></td><td class="n">${estCell(r)}<small>${r[5] != null ? `${esc(r[5])} to ${esc(r[6])}` : 'no interval'}</small></td><td>${esc(r[7] || '')}${r[8] ? `<small>vs ${esc(r[8])}</small>` : ''}</td></tr>`).join('')}</tbody></table></div>` : '<div class="state">None linked to concepts.</div>'}
    <h2 class="h lens">Bias flags <span>${flags.length}</span></h2>
    <div class="lens">${flags.length ? flags.map(f => `<div class="ctx"><small>${esc(String(f[0]).replace(/_/g, ' '))} · ${esc(f[1])}</small>${esc(f[2])}</div>`).join('') : '<div class="state">None recorded.</div>'}</div>`;
  dr.classList.add('open'); dr.setAttribute('aria-hidden', 'false'); $('#scrim').hidden = false;
  $('#dclose').addEventListener('click', closePaper); $('#dclose').focus();
}
function closePaper() {
  const dr = $('#drawer'); if (!dr.classList.contains('open')) return;
  dr.classList.remove('open'); dr.setAttribute('aria-hidden', 'true'); $('#scrim').hidden = true;
  if (drawerReturn && drawerReturn.focus) drawerReturn.focus();
}
$('#scrim').addEventListener('click', closePaper);
document.addEventListener('click', e => { const a = e.target.closest('[data-paper]'); if (a && !e.metaKey && !e.ctrlKey) { e.preventDefault(); openPaper(a.dataset.paper); } });

// ---------- router ----------
let curRoute = null;
function parseHash() {
  const h = location.hash.replace(/^#\/?/, ''); const [path, qs] = h.split('?'); const parts = path.split('/').filter(Boolean).map(decodeURIComponent);
  const params = new URLSearchParams(qs || ''); return {parts, params};
}
const currentQ = () => { const {parts, params} = parseHash(); return parts[0] === 'claim' ? params.get('q') || '' : null; };
function render() {
  if (!D) return;
  const {parts, params} = parseHash(); const v = parts[0] || 'home'; let html = '', after = null, nav = 'home';
  if (v === 'claim' || v === 'search') { const q = (params.get('q') || '').trim(); $('#q').value = q; html = pageSearch(q); after = () => { bindSearch(q); if (q && aiAvailable() && !SEARCH.has(q)) runSearch(q); }; nav = null; }
  else if (v === 'network') { nav = 'network'; html = pageNetwork(); after = bindNetwork; }
  else if (v === 'receipts') { nav = 'receipts'; html = parts[1] ? pageReceipt(parts[1]) : pageReceipts(); }
  else if (v === 'map') { nav = 'map'; html = pageMap(); after = bindMap; }
  else if (v === 'pair') { nav = 'map'; const x = +parts[1], y = +parts[2]; html = pagePair(x, y); after = () => { const p = pairIdx.get(x + '|' + y); if (p) evidenceGraph($('#pgraph'), K[x].label + ' → ' + K[y].label, [p]); }; }
  else if (v === 'paper') { nav = null; html = pagePaper(parts[1] || ''); }
  else if (v === 'about') { nav = 'about'; html = pageAbout(); }
  else { html = pageHome(); after = () => $('#homef').addEventListener('submit', e => { e.preventDefault(); go($('#hq').value); }); }
  $('#view').innerHTML = html; after && after();
  document.querySelectorAll('.nav a').forEach(a => a.setAttribute('aria-current', a.dataset.v === nav ? 'page' : 'false'));
  closePaper();
  if (v !== 'claim' && v !== 'search' && document.activeElement !== $('#q')) $('#q').value = '';
}
function route() {
  const key = location.hash; document.body.classList.toggle('on-home', !key || key === '#' || key === '#/'); if (key !== curRoute) { curRoute = key; claimTab = null; $('#main').scrollTop = 0; window.scrollTo(0, 0); }
  render();
}
const go = q => { q = (q || '').trim(); if (!q) return; location.hash = '#/search?q=' + enc(q); };
addEventListener('hashchange', route);
$('#askf').addEventListener('submit', e => { e.preventDefault(); go($('#q').value); $('#q').blur(); });
$('#view').addEventListener('click', e => { const tr = e.target.closest('tr[data-href]'); if (tr && !e.target.closest('a')) location.hash = tr.dataset.href; });
$('#view').addEventListener('keydown', e => { const tr = e.target.closest('tr[data-href]'); if (tr && e.key === 'Enter') location.hash = tr.dataset.href; });
addEventListener('keydown', e => {
  const typing = /input|textarea|select/i.test(document.activeElement.tagName);
  if ((e.key === 'k' && (e.metaKey || e.ctrlKey)) || (e.key === '/' && !typing)) { e.preventDefault(); const t = document.body.classList.contains('on-home') && $('#hq') ? $('#hq') : $('#q'); t.focus(); t.select(); }
  else if (e.key === 'Escape') { if ($('#drawer').classList.contains('open')) closePaper(); else if (!$('#pop').hidden) $('#pop').hidden = true; else if (document.activeElement === $('#q')) $('#q').blur(); }
});
if (!/Mac|iPhone|iPad/.test(navigator.platform)) $('#kbd').textContent = 'Ctrl K';

// ---------- boot ----------
function loadFailed(msg) {
  $('#loadbox').innerHTML = `<b style="color:var(--ink)">The evidence snapshot did not load.</b><span>${esc(msg)}</span><label class="btn primary">Load snapshot file<input type="file" accept=".json,application/json" hidden id="pick"></label>`;
  $('#pick').addEventListener('change', async e => { const f = e.target.files[0]; if (!f) return; try { init(JSON.parse(await f.text())); } catch (err) { loadFailed('That file is not a Pramana snapshot.'); } });
}
(function boot() {
  aiInit();
  const raw = document.getElementById('snap').textContent.trim();
  if (raw && raw !== 'null' && !raw.startsWith('/*')) { init(JSON.parse(raw)); return; }
  fetch('snapshot.json').then(r => { if (!r.ok) throw new Error('snapshot.json returned ' + r.status); return r.json(); }).then(init).catch(err => loadFailed(err.message + '. Choose the file to load it from disk.'));
})();
</script>
